name: Pullfrog PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      trigger_event:
        type: string
        required: true
      model:
        type: string
        required: true
      llm_base_url:
        type: string
        required: false
      prompt:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}

      - name: Checkout private Pullfrog source
        uses: actions/checkout@v6
        with:
          repository: superduck-ai/pullfrog-private
          ref: main
          token: ${{ secrets.PULLFROG_PRIVATE_REPO_TOKEN }}
          path: .duckpr/pullfrog-private
          persist-credentials: false

      - name: Hide private Pullfrog checkout from git status
        run: echo ".duckpr/" >> .git/info/exclude

      - name: Create DuckPR GitHub App token
        id: duckpr-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DUCKPR_APP_ID }}
          private-key: ${{ secrets.DUCKPR_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-actions: read

      - name: Diagnose Pullfrog LLM configuration
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ inputs.llm_base_url || vars.LLM_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ inputs.llm_base_url || vars.LLM_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          PULLFROG_MODEL: ${{ inputs.model }}
          PULLFROG_PROMPT: ${{ inputs.prompt }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TRIGGER_EVENT: ${{ inputs.trigger_event }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_LLM_BASE_URL: ${{ inputs.llm_base_url }}
          DUCKPR_APP_ID: ${{ secrets.DUCKPR_APP_ID }}
          DUCKPR_PRIVATE_KEY: ${{ secrets.DUCKPR_PRIVATE_KEY }}
          PULLFROG_PRIVATE_REPO_TOKEN: ${{ secrets.PULLFROG_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail

          echo "::group::DuckPR dispatch diagnostics"
          echo "github_run_id=${GITHUB_RUN_ID}"
          echo "github_actor=${GITHUB_ACTOR}"
          echo "github_event_name=${GITHUB_EVENT_NAME}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_sha=${GITHUB_SHA}"
          echo "input_pr_number=${INPUT_PR_NUMBER}"
          echo "input_trigger_event=${INPUT_TRIGGER_EVENT}"
          echo "input_head_sha=${INPUT_HEAD_SHA}"
          echo "input_model=${PULLFROG_MODEL}"
          if [ -n "${INPUT_LLM_BASE_URL}" ]; then
            echo "llm_base_url_source=workflow_dispatch_input"
          else
            echo "llm_base_url_source=actions_variable"
          fi

          node <<'NODE'
          const crypto = require("node:crypto");

          function describeValue(name, value, { secret = false } = {}) {
            const present = Boolean(value);
            console.log(`${name}_present=${present ? "yes" : "no"}`);
            console.log(`${name}_length=${value?.length ?? 0}`);
            if (present && secret) {
              console.log(`${name}_sha256_12=${crypto.createHash("sha256").update(value).digest("hex").slice(0, 12)}`);
            } else if (present) {
              console.log(`${name}=${value}`);
            }
          }

          describeValue("ANTHROPIC_BASE_URL", process.env.ANTHROPIC_BASE_URL);
          describeValue("ANTHROPIC_AUTH_TOKEN", process.env.ANTHROPIC_AUTH_TOKEN, { secret: true });
          describeValue("ANTHROPIC_API_KEY", process.env.ANTHROPIC_API_KEY, { secret: true });
          describeValue("LLM_BASE_URL", process.env.LLM_BASE_URL);
          describeValue("LLM_API_KEY", process.env.LLM_API_KEY, { secret: true });
          describeValue("DUCKPR_APP_ID", process.env.DUCKPR_APP_ID, { secret: true });
          describeValue("DUCKPR_PRIVATE_KEY", process.env.DUCKPR_PRIVATE_KEY, { secret: true });
          describeValue("PULLFROG_PRIVATE_REPO_TOKEN", process.env.PULLFROG_PRIVATE_REPO_TOKEN, { secret: true });

          const prompt = process.env.PULLFROG_PROMPT || "";
          console.log(`pullfrog_prompt_length=${prompt.length}`);
          try {
            const parsed = JSON.parse(prompt);
            console.log("pullfrog_prompt_json=yes");
            console.log(`pullfrog_prompt_version=${parsed.version ?? ""}`);
            console.log(`pullfrog_prompt_model=${parsed.model ?? ""}`);
            console.log(`pullfrog_prompt_triggerer=${parsed.triggerer ?? ""}`);
            console.log(`pullfrog_event_trigger=${parsed.event?.trigger ?? ""}`);
            console.log(`pullfrog_event_issue_number=${parsed.event?.issue_number ?? ""}`);
            console.log(`pullfrog_event_head_sha=${parsed.event?.context?.head_sha ?? ""}`);
            console.log(`pullfrog_event_instruction_length=${parsed.eventInstructions?.length ?? 0}`);
            console.log(`pullfrog_user_prompt_length=${parsed.prompt?.length ?? 0}`);
          } catch (error) {
            console.log("pullfrog_prompt_json=no");
            console.log(`pullfrog_prompt_parse_error=${error instanceof Error ? error.message : String(error)}`);
          }
          NODE
          echo "::endgroup::"

          if [ -z "${ANTHROPIC_BASE_URL}" ] || [ -z "${ANTHROPIC_AUTH_TOKEN}" ] || [ -z "${PULLFROG_MODEL}" ]; then
            echo "::warning::Skipping Anthropic-compatible preflight because base URL, auth token, or model is empty."
            exit 0
          fi

          api_model="${PULLFROG_MODEL}"
          if [[ "${api_model}" == anthropic/* ]]; then
            api_model="${api_model#anthropic/}"
          fi
          export PULLFROG_API_MODEL="${api_model}"
          echo "anthropic_api_model=${PULLFROG_API_MODEL}"

          echo "::group::Anthropic-compatible preflight"
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          status_file="$(mktemp)"
          node - >"${request_file}" <<'NODE'
          const payload = {
            model: process.env.PULLFROG_API_MODEL || process.env.PULLFROG_MODEL,
            max_tokens: 8,
            messages: [{ role: "user", content: "Reply with ok." }],
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          preflight_base_url="${ANTHROPIC_BASE_URL%/}"
          if [[ "${preflight_base_url}" == */v1/messages ]]; then
            preflight_url="${preflight_base_url}"
          elif [[ "${preflight_base_url}" == */v1 ]]; then
            preflight_url="${preflight_base_url}/messages"
          else
            preflight_url="${preflight_base_url}/v1/messages"
          fi
          echo "preflight_url=${preflight_url}"
          curl_exit=0
          curl -sS \
            --connect-timeout 15 \
            --max-time 60 \
            -o "${response_file}" \
            -D "${headers_file}" \
            -w "http_code=%{http_code}\ntime_total=%{time_total}\nremote_ip=%{remote_ip}\n" \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" \
            --data-binary @"${request_file}" \
            "${preflight_url}" >"${status_file}" || curl_exit=$?
          echo "curl_exit=${curl_exit}"
          cat "${status_file}"
          echo "response_headers_subset:"
          grep -Ei '^(date|content-type|x-request-id|request-id|cf-ray|x-ratelimit|retry-after):' "${headers_file}" || true
          echo "response_body_summary:"
          node - "${response_file}" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const raw = fs.readFileSync(path, "utf8");
          console.log(`raw_length=${raw.length}`);
          try {
            const parsed = JSON.parse(raw);
            console.log(`json_type=${parsed.type ?? ""}`);
            console.log(`json_error_type=${parsed.error?.type ?? ""}`);
            console.log(`json_error_code=${parsed.error?.code ?? parsed.code ?? ""}`);
            console.log(`json_error_message=${parsed.error?.message ?? parsed.message ?? ""}`);
            console.log(`json_model=${parsed.model ?? ""}`);
            console.log(`json_stop_reason=${parsed.stop_reason ?? ""}`);
            console.log(`json_content_items=${Array.isArray(parsed.content) ? parsed.content.length : ""}`);
          } catch {
            console.log(raw.slice(0, 1200));
          }
          NODE
          echo "::endgroup::"

          echo "::group::Anthropic-compatible streaming preflight"
          stream_request_file="$(mktemp)"
          stream_response_file="$(mktemp)"
          stream_headers_file="$(mktemp)"
          stream_status_file="$(mktemp)"
          node - >"${stream_request_file}" <<'NODE'
          const payload = {
            model: process.env.PULLFROG_API_MODEL || process.env.PULLFROG_MODEL,
            max_tokens: 16,
            stream: true,
            messages: [{ role: "user", content: "Reply with ok over a streaming response." }],
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          echo "stream_request_json_bytes=$(wc -c <"${stream_request_file}" | tr -d ' ')"
          stream_curl_exit=0
          curl -sS -N \
            --connect-timeout 15 \
            --max-time 120 \
            -o "${stream_response_file}" \
            -D "${stream_headers_file}" \
            -w "http_code=%{http_code}\ntime_total=%{time_total}\nremote_ip=%{remote_ip}\n" \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" \
            --data-binary @"${stream_request_file}" \
            "${preflight_url}" >"${stream_status_file}" || stream_curl_exit=$?
          echo "stream_curl_exit=${stream_curl_exit}"
          cat "${stream_status_file}"
          echo "stream_response_headers_subset:"
          grep -Ei '^(date|content-type|x-request-id|request-id|cf-ray|x-ratelimit|retry-after):' "${stream_headers_file}" || true
          echo "stream_response_body_summary:"
          node - "${stream_response_file}" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");
          console.log(`raw_length=${raw.length}`);

          const dataLines = raw
            .split(/\r?\n/)
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .filter(Boolean);

          let jsonEvents = 0;
          let doneEvents = 0;
          let parseErrors = 0;
          const types = [];
          const errors = [];

          for (const data of dataLines) {
            if (data === "[DONE]") {
              doneEvents++;
              continue;
            }
            try {
              const parsed = JSON.parse(data);
              jsonEvents++;
              if (parsed.type) types.push(parsed.type);
              if (
                parsed.type === "error" ||
                parsed.error ||
                parsed.error_type ||
                parsed.error_status ||
                parsed.code
              ) {
                errors.push({
                  type: parsed.error?.type ?? parsed.type ?? "",
                  code: parsed.error?.code ?? parsed.code ?? "",
                  message: parsed.error?.message ?? parsed.message ?? "",
                });
              }
            } catch {
              parseErrors++;
            }
          }

          console.log(`sse_data_lines=${dataLines.length}`);
          console.log(`sse_json_events=${jsonEvents}`);
          console.log(`sse_done_events=${doneEvents}`);
          console.log(`sse_parse_errors=${parseErrors}`);
          console.log(`sse_event_types=${[...new Set(types)].slice(0, 12).join(",")}`);
          console.log(`sse_error_count=${errors.length}`);
          if (errors.length > 0) {
            console.log(`sse_first_error=${JSON.stringify(errors[0]).slice(0, 800)}`);
          }
          if (dataLines.length === 0) {
            console.log(raw.slice(0, 1200));
          }
          NODE
          echo "::endgroup::"

          echo "::group::Anthropic-compatible medium-context streaming preflight"
          medium_request_file="$(mktemp)"
          medium_response_file="$(mktemp)"
          medium_headers_file="$(mktemp)"
          medium_status_file="$(mktemp)"
          node - >"${medium_request_file}" <<'NODE'
          const filler = Array.from({ length: 1800 }, (_, index) => {
            return `diagnostic_line_${index}: keep this synthetic context stable while replying with ok.`;
          }).join("\n");
          const payload = {
            model: process.env.PULLFROG_API_MODEL || process.env.PULLFROG_MODEL,
            max_tokens: 16,
            stream: true,
            messages: [
              {
                role: "user",
                content: `This is a DuckPR diagnostic medium-context streaming request. Reply with ok.\n\n${filler}`,
              },
            ],
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          echo "medium_request_json_bytes=$(wc -c <"${medium_request_file}" | tr -d ' ')"
          medium_curl_exit=0
          curl -sS -N \
            --connect-timeout 15 \
            --max-time 180 \
            -o "${medium_response_file}" \
            -D "${medium_headers_file}" \
            -w "http_code=%{http_code}\ntime_total=%{time_total}\nremote_ip=%{remote_ip}\n" \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" \
            --data-binary @"${medium_request_file}" \
            "${preflight_url}" >"${medium_status_file}" || medium_curl_exit=$?
          echo "medium_curl_exit=${medium_curl_exit}"
          cat "${medium_status_file}"
          echo "medium_response_headers_subset:"
          grep -Ei '^(date|content-type|x-request-id|request-id|cf-ray|x-ratelimit|retry-after):' "${medium_headers_file}" || true
          echo "medium_response_body_summary:"
          node - "${medium_response_file}" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");
          console.log(`raw_length=${raw.length}`);

          const dataLines = raw
            .split(/\r?\n/)
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .filter(Boolean);

          let jsonEvents = 0;
          let doneEvents = 0;
          let parseErrors = 0;
          const types = [];
          const errors = [];

          for (const data of dataLines) {
            if (data === "[DONE]") {
              doneEvents++;
              continue;
            }
            try {
              const parsed = JSON.parse(data);
              jsonEvents++;
              if (parsed.type) types.push(parsed.type);
              if (
                parsed.type === "error" ||
                parsed.error ||
                parsed.error_type ||
                parsed.error_status ||
                parsed.code
              ) {
                errors.push({
                  type: parsed.error?.type ?? parsed.type ?? "",
                  code: parsed.error?.code ?? parsed.code ?? "",
                  message: parsed.error?.message ?? parsed.message ?? "",
                });
              }
            } catch {
              parseErrors++;
            }
          }

          console.log(`sse_data_lines=${dataLines.length}`);
          console.log(`sse_json_events=${jsonEvents}`);
          console.log(`sse_done_events=${doneEvents}`);
          console.log(`sse_parse_errors=${parseErrors}`);
          console.log(`sse_event_types=${[...new Set(types)].slice(0, 12).join(",")}`);
          console.log(`sse_error_count=${errors.length}`);
          if (errors.length > 0) {
            console.log(`sse_first_error=${JSON.stringify(errors[0]).slice(0, 800)}`);
          }
          if (dataLines.length === 0) {
            console.log(raw.slice(0, 1200));
          }
          NODE
          echo "::endgroup::"

          echo "::group::Anthropic-compatible feature preflights"
          node <<'NODE'
          const url = `${process.env.ANTHROPIC_BASE_URL.replace(/\/+$/, "")}/v1/messages`;
          const headers = {
            "content-type": "application/json",
            "anthropic-version": "2023-06-01",
            authorization: `Bearer ${process.env.ANTHROPIC_AUTH_TOKEN}`,
          };

          function summarizeBody(name, contentType, raw) {
            console.log(`${name}_content_type=${contentType}`);
            console.log(`${name}_raw_length=${raw.length}`);

            const dataLines = raw
              .split(/\r?\n/)
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).trim())
              .filter(Boolean);

            if (dataLines.length === 0) {
              try {
                const parsed = JSON.parse(raw);
                console.log(`${name}_json_type=${parsed.type ?? ""}`);
                console.log(`${name}_json_error_type=${parsed.error?.type ?? ""}`);
                console.log(`${name}_json_error_code=${parsed.error?.code ?? parsed.code ?? ""}`);
                console.log(`${name}_json_error_message=${parsed.error?.message ?? parsed.message ?? ""}`);
                console.log(`${name}_json_model=${parsed.model ?? ""}`);
                console.log(`${name}_json_stop_reason=${parsed.stop_reason ?? ""}`);
              } catch {
                console.log(`${name}_body_preview=${raw.slice(0, 1200)}`);
              }
              return;
            }

            let jsonEvents = 0;
            let doneEvents = 0;
            let parseErrors = 0;
            const types = [];
            const blockTypes = [];
            const errors = [];

            for (const data of dataLines) {
              if (data === "[DONE]") {
                doneEvents++;
                continue;
              }
              try {
                const parsed = JSON.parse(data);
                jsonEvents++;
                if (parsed.type) types.push(parsed.type);
                if (parsed.content_block?.type) blockTypes.push(parsed.content_block.type);
                if (
                  parsed.type === "error" ||
                  parsed.error ||
                  parsed.error_type ||
                  parsed.error_status ||
                  parsed.code
                ) {
                  errors.push({
                    type: parsed.error?.type ?? parsed.type ?? "",
                    code: parsed.error?.code ?? parsed.code ?? "",
                    message: parsed.error?.message ?? parsed.message ?? "",
                  });
                }
              } catch {
                parseErrors++;
              }
            }

            console.log(`${name}_sse_data_lines=${dataLines.length}`);
            console.log(`${name}_sse_json_events=${jsonEvents}`);
            console.log(`${name}_sse_done_events=${doneEvents}`);
            console.log(`${name}_sse_parse_errors=${parseErrors}`);
            console.log(`${name}_sse_event_types=${[...new Set(types)].slice(0, 12).join(",")}`);
            console.log(`${name}_sse_block_types=${[...new Set(blockTypes)].slice(0, 12).join(",")}`);
            console.log(`${name}_sse_error_count=${errors.length}`);
            if (errors.length > 0) {
              console.log(`${name}_sse_first_error=${JSON.stringify(errors[0]).slice(0, 800)}`);
            }
          }

          async function runCase(name, payload) {
            const body = JSON.stringify(payload);
            console.log(`${name}_request_json_bytes=${Buffer.byteLength(body)}`);
            const startedAt = Date.now();
            try {
              const response = await fetch(url, {
                method: "POST",
                headers,
                body,
                signal: AbortSignal.timeout(180_000),
              });
              const raw = await response.text();
              console.log(`${name}_http_code=${response.status}`);
              console.log(`${name}_time_total_ms=${Date.now() - startedAt}`);
              console.log(`${name}_date=${response.headers.get("date") ?? ""}`);
              console.log(`${name}_retry_after=${response.headers.get("retry-after") ?? ""}`);
              summarizeBody(name, response.headers.get("content-type") ?? "", raw);
            } catch (error) {
              console.log(`${name}_fetch_error=${error instanceof Error ? error.message : String(error)}`);
            }
          }

          await runCase("tool_stream", {
            model: process.env.PULLFROG_API_MODEL || process.env.PULLFROG_MODEL,
            max_tokens: 64,
            stream: true,
            tools: [
              {
                name: "report_ok",
                description: "Report a short diagnostic value.",
                input_schema: {
                  type: "object",
                  properties: {
                    value: { type: "string", description: "The value to report." },
                  },
                  required: ["value"],
                  additionalProperties: false,
                },
              },
            ],
            messages: [{ role: "user", content: "Use the report_ok tool with value ok." }],
          });

          await runCase("thinking_stream", {
            model: process.env.PULLFROG_API_MODEL || process.env.PULLFROG_MODEL,
            max_tokens: 1200,
            stream: true,
            thinking: { type: "enabled", budget_tokens: 1024 },
            messages: [{ role: "user", content: "Think briefly, then reply with ok." }],
          });
          NODE
          echo "::endgroup::"

      - name: Configure OpenCode Anthropic-compatible provider
        env:
          LLM_BASE_URL: ${{ inputs.llm_base_url || vars.LLM_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          PULLFROG_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          mkdir -p .duckpr/opencode
          node <<'NODE'
          const fs = require("node:fs");

          const model = process.env.PULLFROG_MODEL || "anthropic/glm-5.2";
          const rawBaseURL = process.env.LLM_BASE_URL || "";
          const slash = model.indexOf("/");
          const provider = slash > 0 ? model.slice(0, slash) : "anthropic";
          const modelId = slash > 0 ? model.slice(slash + 1) : model;

          function normalizeOpenCodeBaseURL(value) {
            let baseURL = value.trim().replace(/\/+$/, "");
            if (baseURL.endsWith("/messages")) {
              baseURL = baseURL.slice(0, -"/messages".length).replace(/\/+$/, "");
            }
            if (!baseURL.endsWith("/v1")) {
              baseURL = `${baseURL}/v1`;
            }
            return baseURL;
          }

          if (provider !== "anthropic") {
            console.log(`Skipping Anthropic-compatible OpenCode provider config for ${model}.`);
            fs.writeFileSync(
              ".duckpr/opencode/opencode.json",
              `${JSON.stringify({ $schema: "https://opencode.ai/config.json" }, null, 2)}\n`
            );
            process.exit(0);
          }

          const config = {
            $schema: "https://opencode.ai/config.json",
            small_model: model,
            provider: {
              anthropic: {
                options: {
                  baseURL: rawBaseURL ? normalizeOpenCodeBaseURL(rawBaseURL) : "{env:LLM_BASE_URL}",
                  apiKey: "{env:LLM_API_KEY}",
                },
                models: {
                  [modelId]: {
                    name: modelId,
                    headers: {
                      Authorization: "Bearer {env:LLM_API_KEY}",
                    },
                  },
                },
              },
            },
          };

          fs.writeFileSync(".duckpr/opencode/opencode.json", `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Configured OpenCode provider anthropic/${modelId}.`);
          NODE

      - name: Run private Pullfrog review
        uses: ./.duckpr/pullfrog-private
        with:
          prompt: ${{ inputs.prompt }}
          model: ${{ inputs.model }}
          token: ${{ steps.duckpr-token.outputs.token }}
          push: disabled
        env:
          # DuckPR passes llm_base_url when it dispatches the workflow. Keep
          # Actions variable fallbacks for manual workflow_dispatch runs.
          LLM_BASE_URL: ${{ inputs.llm_base_url || vars.LLM_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ inputs.llm_base_url || vars.LLM_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.duckpr/opencode/opencode.json
          PULLFROG_MODEL: ${{ inputs.model }}
          PULLFROG_AGENT: opencode
          LOG_LEVEL: debug
