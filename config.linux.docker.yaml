server:
  # Gateway listen address.
  addr: "0.0.0.0:3000"

traffic:
  # Host/IP returned by sandbox port lookup responses. Empty means e2b-local
  # detects the outbound interface IP on startup.
  # advertised_host: "192.168.1.10"

  # Optional host network interface used as the advertised IP source. When this
  # is empty on Linux, e2b-local tries netlink route detection before UDP probing.
  # interface: "eth0"

  # UDP dial target used only to choose the outbound interface when
  # advertised_host and interface are empty, or as the final fallback on Linux.
  advertised_probe_addr: "8.8.8.8:80"

runtime:
  # Docker runtime creates one container per sandbox through the Docker Engine API.
  type: "docker"

docker:
  # Omit host to use DOCKER_HOST, the current user's OrbStack socket when present,
  # or unix:///var/run/docker.sock.
  # host: "unix:///var/run/docker.sock"
  host: "unix:///run/containerd/containerd.sock"

  # Docker templates are discovered from tagged local Docker images.
  # Pull or build images locally before using them as templates.

  # Optional platform override. Empty means let Docker choose the platform,
  # then inspect the selected image architecture.
  # platform: "linux/amd64"

  # Sandbox containers are named <container_name_prefix><sandboxID>.
  container_name_prefix: "e2b-envd-"

  # Optional envd override. Empty means the gateway chooses envd-bin/envd-linux-amd64
  # or envd-bin/envd-linux-arm64 from the selected image architecture.
  # Relative paths are resolved from this config file when explicitly set.
  # envd_binary: "envd-bin/envd-linux-amd64"

  # Enabled by default. Set false to withhold /dev/fuse and SYS_ADMIN from sandboxes.
  enable_fuse: true

  # envd runs on container port 49983; Docker assigns a dynamic localhost host port per sandbox.

  # Business ports to publish from every sandbox container. Docker assigns a
  # dynamic host port per sandbox, so many sandboxes can expose the same
  # container port such as 5000.
  published_ports: [5000]

  # Bind published business ports on all host interfaces for LAN access.
  published_host_ip: "0.0.0.0"

  # Time to wait for envd inside the sandbox container to become healthy.
  health_timeout_seconds: 30
